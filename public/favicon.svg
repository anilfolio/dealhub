<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dh_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182C48" />
      <stop offset="100%" stop-color="#0A1322" />
    </linearGradient>
    <linearGradient id="dh_accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="dh_shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Badge -->
  <rect x="3" y="3" width="58" height="58" rx="14" ry="14" fill="url(#dh_bg)" stroke="#E11D48" stroke-width="2.5" filter="url(#dh_shadow)" />

  <!-- Speed Blade Accent -->
  <path d="M 6 46 L 58 46 L 50 51 L 14 51 Z" fill="url(#dh_accent)" opacity="0.9" />

  <!-- Monogram Text: DH -->
  <g transform="skewX(-8)">
    <text x="35" y="41" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
      font-size="30" 
      font-weight="900" 
      font-style="italic" 
      fill="#FFFFFF" 
      text-anchor="middle" 
      letter-spacing="-1">DH</text>
  </g>

  <!-- Spark Dot -->
  <circle cx="51" cy="15" r="3" fill="#FB7185" />
</svg>