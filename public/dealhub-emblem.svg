<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Metallic Crimson Rim Gradient -->
    <linearGradient id="dhEmblemRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Deep Obsidian Badge Background -->
    <linearGradient id="dhEmblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dhEmblemDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Outer Squircle Frame with Metallic Crimson Border -->
  <rect x="8" y="8" width="184" height="184" rx="46" ry="46"
        fill="url(#dhEmblemBg)"
        stroke="url(#dhEmblemRim)"
        stroke-width="3.5"
        filter="url(#dhEmblemDropShadow)" />

  <!-- 2. Pristine White Inner Tile -->
  <rect x="14" y="14" width="172" height="172" rx="40" ry="40"
        fill="#FFFFFF" />

  <!-- 3. Official DealHub Auto Auction Hub Logo Icon -->
  <image href="/dealhub-logo-transparent.png"
         x="20" y="20" width="160" height="160"
         preserveAspectRatio="xMidYMid meet" />
</svg>
