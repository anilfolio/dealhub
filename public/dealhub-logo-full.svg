<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="fullBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Crimson Primary Gradient -->
    <linearGradient id="fullCrimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Electric Blue Accent Gradient -->
    <linearGradient id="fullBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Rim Gradient -->
    <linearGradient id="fullRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="40%" stop-color="#E11D48" />
      <stop offset="70%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="fullTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <filter id="fullShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- ── 1. EMBLEM (Left: 0..120) ── -->
  <g transform="translate(10, 10)">
    <!-- Squircle badge -->
    <rect x="0" y="0" width="100" height="100" rx="24" ry="24"
          fill="url(#fullBadgeBg)"
          stroke="url(#fullRimGrad)"
          stroke-width="2.5"
          filter="url(#fullShadow)" />

    <!-- Inner subtle stroke -->
    <rect x="3" y="3" width="94" height="94" rx="21" ry="21"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

    <!-- 'D' path scaled down -->
    <path d="M 22 28 C 22 25, 24 23, 27 23 L 46 23 C 60 23, 70 31, 70 45 C 70 54, 64 61, 56 66 L 49 60 C 55 57, 58 51, 58 45 C 58 36, 52 32, 44 32 L 32 32 L 32 75 C 32 78, 30 80, 27 80 L 24 80 C 22 80, 22 78, 22 77 Z"
          fill="url(#fullCrimsonGrad)" />

    <!-- 'H' and Arrow scaled -->
    <path d="M 68 80 C 65 80, 63 78, 63 75 L 63 52 L 54 52 L 54 62 L 48 56 L 48 45 L 63 45 L 63 36 L 74 36 L 74 75 C 74 78, 72 80, 68 80 Z"
          fill="url(#fullBlueGrad)" />

    <!-- Telemetry Pulse Line -->
    <path d="M 26 63 L 41 51 L 51 59 L 71 38 L 82 26" 
          fill="none" stroke="url(#fullBlueGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="82,22 83,30 76,27 73,23" fill="#60A5FA" />
    <circle cx="41" cy="51" r="2" fill="#FFFFFF" />
    <circle cx="51" cy="59" r="2" fill="#FFFFFF" />
    <circle cx="71" cy="38" r="2.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" />

    <!-- Speed Blade Bottom -->
    <path d="M 18 85 L 82 85 L 75 89 L 25 89 Z" fill="url(#fullCrimsonGrad)" opacity="0.9" />
  </g>

  <!-- ── 2. WORDMARK & BRANDING (Right: 130..540) ── -->
  <g transform="translate(130, 0)">
    <!-- Brand Title: DealHub -->
    <text x="0" y="66" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="url(#fullTextGrad)">
      Deal<tspan fill="#E11D48">Hub</tspan>
    </text>

    <!-- Dealer Badge Pill -->
    <rect x="206" y="32" width="76" height="24" rx="6" ry="6" 
          fill="#0284C7" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="244" y="48.5" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="11" 
          font-weight="800" 
          letter-spacing="1" 
          fill="#38BDF8" 
          text-anchor="middle">DEALER</text>

    <!-- Subtitle: Intelligence Platform -->
    <text x="2" y="92" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="3.2" 
          fill="#60A5FA" 
          text-transform="uppercase">
      INTELLIGENCE PLATFORM
    </text>

    <!-- Geographic Corridor Indicator -->
    <text x="2" y="110" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="9.5" 
          font-weight="600" 
          letter-spacing="0.8" 
          fill="#64748B">
      JAPAN AUCTIONS ➔ NZ LANDED COST ARBITRAGE
    </text>
  </g>
</svg>
