<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Crimson Rim Gradient -->
    <linearGradient id="fullRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="fullTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="fullShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- ── 1. EMBLEM WITH ATTACHED AUTO AUCTION HUB LOGO (Left: 10..110) ── -->
  <g transform="translate(10, 10)">
    <!-- Squircle badge frame -->
    <rect x="0" y="0" width="100" height="100" rx="24" ry="24"
          fill="#0B1322"
          stroke="url(#fullRimGrad)"
          stroke-width="2.5"
          filter="url(#fullShadow)" />

    <!-- Crisp white inner tile -->
    <rect x="3" y="3" width="94" height="94" rx="21" ry="21"
          fill="#FFFFFF" />

    <!-- Exact Auto Auction Hub Logo Icon -->
    <image href="/dealhub-logo-transparent.png"
           x="8" y="8" width="84" height="84"
           preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- ── 2. WORDMARK & BRANDING (Right: 130..540) ── -->
  <g transform="translate(130, 0)">
    <!-- Brand Title: DealHub -->
    <text x="0" y="66" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="-1.5" 
          fill="url(#fullTextGrad)">
      Deal<tspan fill="#E11D48">Hub</tspan>
    </text>

    <!-- Dealer Badge Pill -->
    <rect x="206" y="32" width="76" height="24" rx="6" ry="6" 
          fill="#0284C7" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="244" y="48.5" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="11" 
          font-weight="800" 
          letter-spacing="1" 
          fill="#38BDF8" 
          text-anchor="middle">DEALER</text>

    <!-- Subtitle: Intelligence Platform -->
    <text x="2" y="92" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="3.2" 
          fill="#60A5FA" 
          text-transform="uppercase">
      INTELLIGENCE PLATFORM
    </text>

    <!-- Geographic Corridor Indicator -->
    <text x="2" y="110" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="9.5" 
          font-weight="600" 
          letter-spacing="0.8" 
          fill="#94A3B8">
      JAPAN AUTO AUCTIONS ➔ NZ LANDED COST ARBITRAGE
    </text>
  </g>
</svg>
