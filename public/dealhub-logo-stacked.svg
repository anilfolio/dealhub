      <stop offset="0%" stop-color="#E8334E" />
      <stop offset="40%" stop-color="#C8243A" />
      <stop offset="100%" stop-color="#8B1228" />
    </linearGradient>
    <linearGradient id="stackedBevel" x1="10%" y1="10%" x2="90%" y2="90%">
