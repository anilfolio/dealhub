      <path d="M 542 464 L 464 480 L 480 498 L 524 498 L 550 524 L 550 472 Z" />
      <path d="M 766 234 L 644 260 L 672 288 L 718 334 L 746 362 Z" />
      <path d="M 766 234 L 718 334 L 746 362 Z" fill="url(#stackedBevel)" opacity="0.65" />
