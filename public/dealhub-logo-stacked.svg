    <filter id="stackedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#8B1228" flood-opacity="0.25" />
    </filter>
  </defs>

  

