          font-weight="900"
          letter-spacing="-1.5">
      <tspan fill="#333333">Deal</tspan><tspan fill="#C8243A">Hub</tspan>
    </text>

    <!-- PLATFORM -->
    <text x="180" y="332"
          font-family="'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="18"
          font-weight="800"
          letter-spacing="9"
